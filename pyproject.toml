[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "howlcreate"
version = "0.2.0"
description = "Computational creativity and open-ended problem solving layer for the Howl ecosystem."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "howlcipher" }
]
dependencies = ["howl-provider-core>=0.1.0,<0.2.0", "jsonschema>=4.20,<5"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "ruff>=0.1",
]

[project.scripts]
howlcreate = "howlcreate.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
howlcreate = ["schemas/*.json", "schemas/SOURCE.md"]
