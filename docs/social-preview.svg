<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
    <rect width="1200" height="630" fill="#14191C" />
    <!-- Ambient glows -->
    <circle cx="200" cy="150" r="400" fill="#102A43" opacity="0.6" />
    <circle cx="1000" cy="500" r="400" fill="#F2A91B" opacity="0.12" />
    
    <!-- Scanlines -->
    <pattern id="scanlines" width="10" height="4" patternUnits="userSpaceOnUse">
        <rect width="10" height="2" fill="rgba(255,255,255,0.03)" />
    </pattern>
    <rect width="1200" height="630" fill="url(#scanlines)" />

    <!-- Border container -->
    <rect x="50" y="50" width="1100" height="530" fill="none" stroke="#F2A91B" stroke-width="3" />
    <rect x="56" y="56" width="1088" height="518" fill="none" stroke="#353B3D" stroke-width="1" />
    
    <!-- Header bar -->
    <rect x="50" y="50" width="1100" height="40" fill="#102A43" />
    <text x="75" y="76" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#F2A91B" font-weight="bold">HOWL // CREATE // COMPUTATIONAL CREATIVITY LAYER</text>
    <text x="1125" y="76" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#E7E1CE" text-anchor="end">SYS_ID: HCRT-IDEATE-07</text>

    <!-- Title -->
    <text x="100" y="170" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="52" font-weight="bold" fill="#E7E1CE">HOWLCREATE<tspan fill="#F2A91B">_</tspan></text>
    <text x="100" y="215" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#827C68">// computational creativity, lateral exploration &amp; concept lineage</text>

    <!-- Flow diagram -->
    <g transform="translate(100, 280)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="bold">
        <rect x="0" y="0" width="125" height="50" fill="#1B2226" stroke="#F2A91B" stroke-width="2" rx="4"/>
        <text x="62" y="32" fill="#E7E1CE" text-anchor="middle">IDEA</text>
        
        <text x="145" y="32" fill="#F2A91B" font-size="22">→</text>
        
        <rect x="170" y="0" width="130" height="50" fill="#1B2226" stroke="#F2A91B" stroke-width="2" rx="4"/>
        <text x="235" y="32" fill="#E7E1CE" text-anchor="middle">EXPLORE</text>
        
        <text x="320" y="32" fill="#F2A91B" font-size="22">→</text>
        
        <rect x="345" y="0" width="130" height="50" fill="#1B2226" stroke="#F2A91B" stroke-width="2" rx="4"/>
        <text x="410" y="32" fill="#E7E1CE" text-anchor="middle">REFRAME</text>
        
        <text x="495" y="32" fill="#F2A91B" font-size="22">→</text>
        
        <rect x="520" y="0" width="130" height="50" fill="#1B2226" stroke="#F2A91B" stroke-width="2" rx="4"/>
        <text x="585" y="32" fill="#E7E1CE" text-anchor="middle">MUTATE</text>
        
        <text x="670" y="32" fill="#F2A91B" font-size="22">→</text>
        
        <rect x="695" y="0" width="130" height="50" fill="#1B2226" stroke="#F2A91B" stroke-width="2" rx="4"/>
        <text x="760" y="32" fill="#E7E1CE" text-anchor="middle">CHALLENGE</text>
        
        <text x="845" y="32" fill="#F2A91B" font-size="22">→</text>
        
        <rect x="870" y="0" width="130" height="50" fill="#1B2226" stroke="#087FAF" stroke-width="2" rx="4"/>
        <text x="935" y="32" fill="#E7E1CE" text-anchor="middle">HAND OFF</text>
    </g>

    <!-- Core Principle Card -->
    <rect x="100" y="380" width="1000" height="110" fill="#1B2226" stroke="#353B3D" stroke-width="1.5" rx="4" />
    <text x="130" y="425" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="bold" fill="#F2A91B">CORE QUESTION // WHAT COULD WE DO?</text>
    <text x="130" y="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#E7E1CE">Divergence before convergence. Disciplined multi-operator search extracting assumptions before HowlPlane orchestrates execution.</text>

    <!-- Footer -->
    <text x="100" y="545" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#827C68">HOWL ECOSYSTEM 2026 // OPEN SOURCE</text>
    <circle cx="1030" cy="540" r="6" fill="#F2A91B" />
    <text x="1125" y="545" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#F2A91B" text-anchor="end">STATUS: ACTIVE</text>
</svg>
